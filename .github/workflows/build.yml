name: Build Action

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths:
      - '**.java'
      - '**.kt'
      - '*.gradle.kts'
      - '**[Dd]ocker*'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - '**.java'
      - '**.kt'
      - '*.gradle.kts'
      - '**[Dd]ocker*'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: 'Upload artifact'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v')}}

env:
  UPLOAD_ARTIFACT: ${{ github.event.inputs.upload-artifact || false }}

jobs:
  build:
    name: Build - Standalone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java-version: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          java-version: ${{ matrix.java-version }}
          java-package: jdk
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # ratchet:gradle/actions/setup-gradle@v4

      - name: Build Package
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload artifact
        if: ${{ env.UPLOAD_ARTIFACT == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OmniFlow
          path: ./build/libs/*.jar
          if-no-files-found: error
